  name: Avito transactions API
  description: >-
    С помощью API данного раздела вы можете выполнять переводы средств клиентам и отслеживать транзакции.


    [Выполните](#operation/agencyBalance) перевод средств на счёт клиента и получите идентификатор транзакции.

