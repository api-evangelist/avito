aid: avito
name: Avito
description: Avito is Russia's largest online classifieds platform (avito.ru), founded in 2007, where
  individuals and businesses buy and sell across goods, vehicles, real estate, jobs and services. For
  business sellers and integrators Avito publishes a public Developer Portal (developers.avito.ru) exposing
  25 OpenAPI 3.0.0 REST APIs on api.avito.ru covering item/listing management, autoload feed ingestion,
  the buyer-seller messenger, delivery, order and stock management, ratings and reviews, advertising and
  CPA/promotion campaigns, short-term rental, jobs (Avito.Rabota), and Autoteka vehicle history. All APIs
  use OAuth 2.0 (authorization_code for acting on behalf of users, client_credentials for a business's
  own account) with scoped access and per-minute rate limiting.
