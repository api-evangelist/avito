- aid: avito:avito-invite-api
  name: Avito invite API
  description: >-
    С помощью API данного раздела вы можете приглашать в агентство новых клиентов.


    [Отправьте](#operation/agencyUsersInviteSend) приглашение новому клиенту и получите идентификатор
    приглашения.

    Затем по идентификатору:


    - [проверьте](#operation/agencyUsersInviteStatus) статус приглашения, чтобы понять,
      было ли приглашение принято или отклонено клиентом;
    - [убедитесь](#operation/agencyUsersVerificationStatus),
      что верификация рекламного аккаунта клиента прошла успешно (актуально для рекламной модели).

    ### Типы авторизации


