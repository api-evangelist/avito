- aid: avito:avito-targeting-api
  name: Avito targeting API
  description: >-
    С помощью API данного раздела вы можете узнать статус клиентов, проверив их ИНН.

    За клиентов в статусе «Новый» или «Аплифт» агентству выплачивается комиссия.

    Подробные правила указаны в соглашении о премировании.


    [Создайте](#operation/agencyClientsTargetCreate) задачу на проверку ИНН клиентов и получите её идентификатор.

    Затем с помощью идентификатора [проверьте](#operation/agencyClientsTargetResult) её статус
      и получите результаты проверки, если задача завершилась успешно.

