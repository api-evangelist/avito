          example: '4'
          type: string
        house:
          description: Номер дома, корпуса, строения пользователя.
          example: 20с2
          type: string
        porch:
          description: Номер подъезда.
          example: '2'
          type: string
      required:
      - house
    Delivery-weight:
      description: Вес в граммах
      example: 1000
      maximum: 50000
      minimum: 0
      title: Вес
    CreateParcelData:
      description: 'Тело ответа.


        Поле присутствует, если запрос был успешно обработан. Если случилась ошибка, то поле отсутствует.

        '
      properties:
        barcodes:
          description: 'Штрихкоды посылки.


            Штрихкоды обязательны к возврату в случае кросс-доставки.

            '
          example:
          - '1000001389165'
          - '1000001389166'
          items:
            type: string
          minLength: 1
          type: array
        dispatchNumber:
          description: Идентификатор посылки по версии службы доставки.
          example: 00000138916
          type: string
        trackingNumber:
          description: Трек-номер посылки по версии службы доставки.
          example: 00000138916
          type: string
      required:
      - dispatchNumber
      - trackingNumber
      type: object
    cancelParcelRequest:
      properties:
        actor:
          description: Кто отменяет посылку
          enum:
          - receiver
          type: string
        parcelID:
          $ref: '#/components/schemas/Delivery-orderId-string'
      required:
      - parcelID
      - actor
      type: object
    CreateParcelClientDelivery:
      properties:
        completenessAndIntegrity:
          description: 'Где осуществляется проверка целостности и комплектности вложений посылки.

            '
          example:
          - DIRECT_FLOW
          - RETURN_FLOW
          items:
            enum:
            - DIRECT_FLOW
            - RETURN_FLOW
            type: string
          type: array
        courier:
          $ref: '#/components/schemas/CreateParcelClientDeliveryCourier'
        secondPartyLogist:
          $ref: '#/components/schemas/CreateParcelClientDeliverySecondPartyLogist'
        sortingCenter:
          $ref: '#/components/schemas/CreateParcelClientDeliverySortingCenter'
        terminal:
          $ref: '#/components/schemas/CreateParcelClientDeliveryTerminal'
        type:
          description: 'Тип доставки.


            - `TERMINAL` – в пункт выдачи заказов.

            - `SORTING_CENTER` – в сортировочный центр (для кросс-доставки).

            - `COURIER` - доставка курьером.

            '
          enum:
          - TERMINAL
          - SORTING_CENTER
          - COURIER
          example: TERMINAL
          type: string
      required:
      - type
    CreateParcelPayment:
      properties:
        delivery:
          properties:
            costWithoutVat:
              description: Стоимость в копейках без НДС.
              example: 10000
              minimum: 0
              type: integer
            status:
              $ref: '#/components/schemas/CreateParcelPaymentStatus'
          required:
          - status
          - costWithoutVat
          type: object
        items:
          properties:
            cost:
              description: Стоимость в копейках.
              example: 10000
              minimum: 0
              type: integer
            status:
              $ref: '#/components/schemas/CreateParcelPaymentStatus'
          required:
          - status
          - cost
          type: object
      required:
      - items
      - delivery
  parameters:
    authHeader:
      description: Токен для авторизации
      example: Bearer ACCESS_TOKEN
      in: header
      name: Authorization
      required: true
  responses:
    DeliveryUnauthorized:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/DeliveryError4XX'
            type: object
      description: Ошибка аутентификации. Например, некорректный токен.
    DeliveryForbidden:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/DeliveryError4XX'
            type: object
      description: Ошибка авторизации. Например, нет прав для выполнения операции.
    DeliveryInternalServerError:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/DeliveryError'
            type: object
      description: internal server error
  securitySchemes:
    AuthorizationCode:
      description: Это API использует OAuth 2 с механизмом authorization_code. Используйте его для доступа к данным других пользователей при разработке стороннего приложения. [Подробнее](/api-catalog/auth/documentation#tag/ApplicationAccess)
      flows:
        authorizationCode:
          authorizationUrl: https://avito.ru/oauth
          scopes:
            ah:access: Взаимодействие с иерархией аккаунтов
          tokenUrl: https://api.avito.ru/token
      type: oauth2
    ClientCredentials:
      description: Это API использует OAuth 2 с механизмом client_credentials. Используйте его для доступа к возможностям своей личной учетной записи. [Подробнее](#tag/Access)
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://api.avito.ru/token
      type: oauth2
