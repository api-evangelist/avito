        dateTimeInterval:
          $ref: '#/components/schemas/CreateParcelClientDeliveryCourierDateTimeInterval'
        options:
          $ref: '#/components/schemas/CreateParcelClientDeliveryCourierOptions'
        pickupContact:
          $ref: '#/components/schemas/CreateParcelClientDeliveryCourierPickupContact'
        provider:
          description: Cлужба доставки, которая будет осуществлять курьерскую доставку.
          example: pecom-t2d
          type: string
      required:
      - provider
      - address
      - dateTimeInterval
    CreateParcelItemImagesUrls:
      properties:
        list:
          description: 'Список URL-ов фотографий.

            '
          example:
          - //24.img.avito.st/image/1/1.pUbrSba6Ca_d4MuqrTPvNzbqD6tfagFtWuoNp1_iCw.kszrqWjK0pNKI4ayaT821U-Ln2lzT8lSuqNt7pqedno
          - //19.img.avito.st/image/1/1.rlbjCLa6Ar_VocC6s3LkJz6rBLtXKwp9UqsGt1ejAA.C4io31wn3Rjlc7SJGgeIVyxzC9LnoQUkGwmyaQ67-qs
          - //90.img.avito.st/image/1/1.Z0Dh2ba6y6nXcAmso6AtMTx6za1V-sNrUHrPoVVyyQ.T1yZ87ZDiUSrUQNTYJkDbXub3lHC9_XBFtc8D1jOt7c
          - //76.img.avito.st/image/1/1.QTUceba67dwq0C_ZEngLRMHa69ioWuUerdrp1KjS7w.JABYB8SsN5W6u5Y6WR49R8kKzr5IsGxF5HTjQPnygYQ
          - //85.img.avito.st/image/1/1.eITjzra61G3VZxZon88y9T5t0mlX7dyvUm3QZVdl1g.aQyF5iZccldCZ5p9qtb-DZZobnPzdCSanQJmdHXQvdc
          items:
            type: string
          type: array
        listing:
          description: 'URL основной фотографии.

            '
          example: //24.img.avito.st/image/1/1.pUbrSba6Ca_d4MuqrTPvNzbqD6tfagFtWuoNp1_iCw.kszrqWjK0pNKI4ayaT821U-Ln2lzT8lSuqNt7pqedno
          type: string
      required:
      - listing
      - list
    DateWithTz:
      example: '2023-09-20T10:00:00.52Z'
      type: string
    Delivery-senderReceiveTerminalCode:
      description: 'Терминал отправителя, в который едет возврат. <br />

        Используется для посылок в статусах `IN_TRANSIT_RETURN` и `ON_DELIVERY_RETURN` в случае смены терминала. <br />

        Рекомендуется не передавать данный параметр совместно с остальными.

        '
      example: 5001
      nullable: true
      title: Терминал отправителя, в который едет возврат.
      type: string
    CreateParcelOptionsReturnPolicy:
      properties:
        action:
          description: 'Какое действие выполнить в случае возврата посылки.

            '
          enum:
          - DISABLED
          - DESTROY
          - RETURN_TO_DEPARTURE_POINT
          - RETURN_TO_RECEIVER
          - MOVE_TO_ON_DEMAND_STORAGE
          example: DESTROY
          type: string
        after:
          description: 'Через какое время выполнить действие `action`.


            Отсутствие поля означает, что выполнить нужно сразу.

            '
          properties:
            unit:
              description: Единица интервала.
              enum:
              - DAY
              example: DAY
              type: string
            value:
              description: Через сколько `unit` выполнить действие `action`.
              example: 14
              minimum: 1
              type: integer
          required:
          - unit
          - value
          type: object
      required:
      - action
    CreateParcelError:
      description: 'Ошибка создания посылки.


        Поле присутствует, если запрос не был успешно обработан. Если запрос был успешно обработан, то поле отсутствует.

        '
      properties:
        code:
          description: "Код ошибки.\n\n- `VALIDATION_ERROR` – ошибка валидации данных (например, длина передаваемого поля превышает допустимые лимиты, или какое-то поле отсутствует). \nВ поле `error.message` должно содержаться пояснение, какое поле не прошло валидацию.\n- `UNSUPPORTED_PARAM_ERROR` – в запросе получен неподдерживаемый параметр. В поле `error.message` должно содержаться пояснение, какое поле не поддерживается.\n- `TERMINAL_UNAVAILABLE` – терминал, указанный в запросе, недоступен для создания посылки. В поле `error.message` должно содержаться пояснение причины недоступности терминала.\n- `SORTING_CENTER_UNAVAILABLE` – сортировочный центр, указанный в запросе, недоступен для создания посылки. В поле error.message должно содержаться пояснение причины недоступности сортировочного центра.\n\nВсе перечисленные ошибки – \"терминальные\". \nПри получении этих ошибок Avito не будет выполнять повторные запросы, т.к. повтор приведет к тому же результату.\n\nСписок в дальнейшем может пополняться.\n"
          enum:
          - VALIDATION_ERROR
          - UNSUPPORTED_PARAM_ERROR
          - TERMINAL_UNAVAILABLE
          - SORTING_CENTER_UNAVAILABLE
          example: VALIDATION_ERROR
          type: string
        message:
          description: Текстовое описание ошибки
          example: Текст ошибки
          type: string
      required:
      - code
      - message
      type: object
    CreateParcelClientDeliveryCourierPickupContact:
      description: 'Контактное лицо для забора посылки курьером. Заполняется для отправителя в сценарии Дверь-Терминал.

        Может отличаться от имени отправителя (например, если отправитель – юридическое лицо).

        '
      properties:
        name:
          description: ФИО контактного лица для забора посылки.
          example: Иванов Иван Иванович
          type: string
        phone:
          description: Телефон контактного лица для забора посылки.
          example: '+79999999999'
          type: string
      required:
      - name
      - phone
    ChangeParcelsError:
      description: 'Ошибка регистрации заявки на изменение посылок.

        Поле присутствует, если запрос не был успешно обработан. Если запрос был успешно обработан, то поле отсутствует.

        '
      properties:
        code:
          description: "Код ошибки. <br />\n<ol>\n  <li><code>VALIDATION_ERROR</code> – ошибка валидации входящих параметров. Например:<ul>\n    <li>Длина передаваемого поля превышает допустимые лимиты.</li>\n    <li>В запросе отсутствует поле, обязательное для данного типа (<code>type</code>) заявки.\n  В поле <code>error.message</code> должно содержаться пояснение, какое поле не прошло валидацию. </li>\n  </ul></li>\n  <li><code>UNSUPPORTED_PARAM_ERROR</code> – в запросе получен неподдерживаемый параметр. Например:<ul>\n    <li>В запросе передан тип (<code>type</code>) заявки, который не реализован на стороне СД.</li>\n    <li>Запрос содержит заполненные поля, которые не соответствую типу (<code>type</code>) заявки. Например для заявки с <code>type=extendParcelStorage</code> передано заполненное поле <code>receiver.phones</code>\nВ поле <code>error.message</code> должно содержаться пояснение, какое поле не поддерживается.</li>\n  </ul></li>\n<br />\n<br />\n<b>Важно!</b> Перечисленные выше ошибки можно использовать только для проверки корректности входящего контракта и запрещено использовать для проверки бизнес-логики сценария.<br />\nВсе возникающие ошибки бизнес-логики, которые могут возникнуть в процессе исполнения заявки, должны передаваться в поле <code>reason</code> запроса <code>changeParcelResult</code> <br />\nПримеры ошибок бизнес-логики:<br />\n<ol>\n  <li>На стороне СД не найдена посылка по переданному `parcelID`.</li>\n  <li>Посылка, для которой необходимо выполнить заявку запрета приема в ПВЗ отправки (<code>prohibitParcelAcceptance</code>), уже принята в ПВЗ отправки.</li>\n  <li>Посылка, для которой необходимо продлить срок хранения посылки (<code>extendParcelStorage</code>), уже истек срок хранения и она отправлена на возврат.</li>\n  <li>Посылка, для которой необходимо запретить выдачу в ПВЗ вручения (<code>prohibitParcelReceive</code>) уже вручена получателю.</li>\n</ol>\n\nВсе перечисленные ошибки – \"терминальные\".\nПри получении этих ошибок Avito не будет выполнять повторные запросы, т.к. повтор приведет к тому же результату.\nСписок в дальнейшем может пополняться.\n"
          enum:
          - VALIDATION_ERROR
          - UNSUPPORTED_PARAM_ERROR
          example: VALIDATION_ERROR
          type: string
        message:
          description: 'Человекочитаемые детали произошедшей ошибки.

            Поле будет использоваться живыми людьми для диагностирования проблемы.

            '
          example: applications[0].parcelID field is required
          type: string
      required:
      - code
      - message
      type: object
    CreateParcelItemWeight:
      properties:
        accuracy:
          $ref: '#/components/schemas/CreateParcelPropertyAccuracy'
        value:
          description: Вес в граммах.
          maximum: 50000
          minimum: 1
          type: integer
      required:
      - accuracy
      - values
    CreateParcelClientDeliveryCourierAddressDetails:
      description: 'Детали адреса курьерской доставки.

        '
      properties:
        flat:
