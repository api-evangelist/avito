    DeliveryDayTimeIntervals:
      description: 'Список интервалов времени внутри одного дня, в формате - `hh:mm:ss/hh:mm:ss`

        Время локальное для региона загружаемых данных.

        '
      items:
        $ref: '#/components/schemas/DeliveryDayTimeInterval'
      type: array
    TariffZone:
      properties:
        deliveryProviderZoneId:
          description: Id тарифной зоны на стороне службы доставки
          example: t42
          type: string
        items:
          description: "Модели расчета цены для каждой из услуг.\n<br>\nСтоимость доставки складывается из суммы стоимостей описанных здесь услуг. <br />\nМодели расчета разделены на B2C и С2С. Это значит, что для расчета стоимости доставки C2C посылки будут использоваться C2C модели расчета.  <br />\nЕсли в тарифной зоне нет подходящих моделей, то терминалы относящиеся к такой тарифной зоне не будут участвовать в расчете и показе.  <br /> \n**Необходимо указывать модели расчета для С2С и для B2C, даже если цены совпадают.** <br />\nНо для сохранения обратной совместимости, пока СД не начала поддерживать разделение на B2C и С2С, для B2C и C2C будут использоваться С2С модели расчета.\n"
          example:
          - calculationMechanic: GAP_TO_COST
            chargeableParameter: WEIGHT
            serviceName: DELIVERY
            values:
            - cost: 50000
              maxWeight: 3000
            - cost: 60000
              maxWeight: 7000
            - cost: 70000
              maxWeight: 10000
            - cost: 90000
              maxWeight: 20000
          - calculationMechanic: GAP_TO_PERCENT
            chargeableParameter: DECLARED_COST
            serviceName: INSURANCE
            values:
            - maxDeclaredCost: 10000
              percent: 1
            - maxDeclaredCost: 1000000
              percent: 1.5
          - calculationMechanic: GAP_TO_COST
            chargeableParameter: PAID_WEIGHT
            serviceName: DELIVERY_B2C
            values:
            - cost: 45000
              dimensionalFactor: 5000
              maxWeight: 3000
            - cost: 55000
              dimensionalFactor: 5000
              maxWeight: 7000
            - cost: 65000
              dimensionalFactor: 5000
              maxWeight: 10000
            - cost: 85000
              dimensionalFactor: 5000
              maxWeight: 20000
          - calculationMechanic: GAP_TO_PERCENT
            chargeableParameter: DECLARED_COST
            serviceName: INSURANCE_B2C
            values:
            - maxDeclaredCost: 10000
              percent: 1.5
            - maxDeclaredCost: 1000000
              percent: 2
          items:
            anyOf:
            - $ref: '#/components/schemas/DeliveryTariffZone-ServiceDeliveryC2C'
            - $ref: '#/components/schemas/DeliveryTariffZone-ServiceDeliveryB2C'
            - $ref: '#/components/schemas/DeliveryTariffZone-ServiceDeliveryC2CWithStepCost'
            - $ref: '#/components/schemas/DeliveryTariffZone-ServiceDeliveryB2CWithStepCost'
            - $ref: '#/components/schemas/DeliveryTariffZone-ServiceInsuranceC2C'
            - $ref: '#/components/schemas/DeliveryTariffZone-ServiceInsuranceB2C'
            - $ref: '#/components/schemas/DeliveryTariffZone-ServiceDeliveryC2CWithStepMinCost'
            - $ref: '#/components/schemas/DeliveryTariffZone-ServiceDeliveryB2CWithStepMinCost'
          type: array
        name:
          description: Человекопонятное название тарифной зоны (будет использоваться в интерфейсной части)
          example: Тарифная зона t42
          type: string
      required:
      - name
      - deliveryProviderTariffZoneId
      - items
      type: object
    DeliveryTariffZone-ServiceInsuranceB2C:
      description: Описание модели тарификации какой-либо из услуг доставки
      properties:
        calculationMechanic:
          description: Механика расчета стоимости
          enum:
          - GAP_TO_PERCENT
          type: string
        chargeableParameter:
          enum:
          - DECLARED_COST
          example: DECLARED_COST
          type: string
        serviceName:
          enum:
          - INSURANCE_B2C
          example: INSURANCE_B2C
          type: string
        values:
          description: Список значений для рассчета страховки.
          items:
            properties:
              maxDeclaredCost:
                description: Верхняя граница объявленной стоимости отправления (в копейках), до которой (не включительно) услуга страховки отправления не превышающего данную стоимость будет тарифицироваться в соответствии со значением указанным в поле percent
                example: 10000
                format: int32
                type: integer
              percent:
                description: Процент от объявленной стоимости, по которому рассчитывается стоимость страховки отправления в диапазоне от предыдущего maxDeclaredCost до текущего
                example: 1
                format: float
                type: number
            type: object
          type: array
      required:
      - serviceName
      - calculationMechanic
      - chargeableParameter
      - values
      title: Страховка B2C
      type: object
    Restriction:
      properties:
        dimensionalFactor:
          description: "Используется при подсчете ограничения по объемному весу в пункте выдачи по формуле: Д * Ш * В / dimensionalFactor = объемный вес. \nЕсли задан maxDimensionalWeight, то dimensionalFactor должен быть обязательно передан.\n"
          example: 1000
          format: int32
          maximum: 100000
          minimum: 1000
          type: integer
        maxDeclaredCost:
          description: "Максимальное ограничения по объявленной стоимости товара, который можно получить/отправить в пункте выдачи. Значение указывается в копейках.  \nЕсли объявленная стоимость товара будет больше этого значения, Авито посчитает невозможным отправку/получение товара через этот пункт\nи не даст покупателю выбрать его как точку доставки/сдачи посылки.\n"
          example: 1000
          format: int32
          maximum: 15000000
          minimum: 1000
          type: integer
        maxDimensionalWeight:
          description: "Максимальное ограничения по объемному весу товара, который можно получить/отправить в пункте выдачи. \nЕсли объемный вес товара будет больше этого значения, Авито посчитает невозможным отправку/получение товара через этот пункт\nи не даст покупателю выбрать его как точку доставки/сдачи посылки.\n"
          example: 1000
          format: int32
          maximum: 100000000000
          minimum: 1000
          type: integer
        maxDimensions:
          description: "Максимальные ограничения по габаритам товара, который можно получить/отправить в пункте выдачи. Значение указывается в сантиметрах.  \nЕсли габариты товара будет больше этого значения, Авито посчитает невозможным отправку/получение товара через этот пункт\nи не даст покупателю выбрать его как точку доставки/сдачи посылки.\n"
          example:
          - 200
          - 50
          - 30
          items:
            format: int32
            maximum: 3000
            minimum: 0
            type: integer
          type: array
        maxWeight:
          description: "Максимальный вес товара, который можно получить или отправить в пункте выдачи. Значение указывается в граммах.  \nЕсли вес товара будет больше этого значения, Авито посчитает невозможным отправку/получение товара через этот пункт \nи не даст покупателю выбрать его как точку доставки/сдачи посылки.\n"
          example: 1000
          format: int32
          maximum: 100000000000
          minimum: 1000
          type: integer
      required:
      - maxWeight
      - maxDimensions
      - maxDeclaredCost
      type: object
