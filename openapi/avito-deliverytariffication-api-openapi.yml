      description: Описание модели тарификации какой-либо из услуг доставки
      discriminator:
        mapping:
          DIMENSIONS: '#/components/schemas/DeliveryTariffZone-ServiceDeliveryC2CByDimension'
          PAID_WEIGHT: '#/components/schemas/DeliveryTariffZone-ServiceDeliveryC2CByPaidWeight'
          WEIGHT: '#/components/schemas/DeliveryTariffZone-ServiceDeliveryC2CByWeight'
        propertyName: chargeableParameter
      properties:
        calculationMechanic:
          description: 'Механика расчета стоимости <br />

            `GAP_TO_COST` - Механизм расчета при которой в зависимости от параметров отправления подбирается минимально возможное значение параметра `chargeableParameter` и соответствующая ему стоимость доставки

            '
          enum:
          - GAP_TO_COST
          type: string
        chargeableParameter:
          description: "Параметр, относительно которого расчитывается стоимость доставки отправления\n<br />\n  `WEIGHT` - Расчет относительно веса отправления<br />\n  `DIMENSIONS` - Расчет относительно габаритов отправления<br />\n  `PAID_WEIGHT` - Расчет относительно платного веса (большего из реального и объемного весов)<br />\n"
          enum:
          - WEIGHT
          - DIMENSIONS
          - PAID_WEIGHT
          example: WEIGHT
          type: string
        serviceName:
          description: Услуга доставки C2C
          enum:
          - DELIVERY
          example: DELIVERY
          type: string
      required:
      - serviceName
      - calculationMechanic
      - chargeableParameter
      title: Доставка C2C
      type: object
    AddAreasRequest:
      items:
        $ref: '#/components/schemas/Area'
      type: array
    AddTariffReply:
      properties:
        data:
          nullable: true
          properties:
            taskId:
              description: id задачи на добавление тарифа, по которому узнать статус загрузки тарифа
              format: int32
              type: integer
          type: object
        error:
          $ref: '#/components/schemas/DeliveryError'
      type: object
    AddTariffRequestV2:
      properties:
        deliveryProviderTariffId:
          description: 'Идентификатор тарифного плана на стороне службы доставки - должен быть уникален.

            '
          example: FAST_FROM_2020-02-10
          title: id тарифного плана на стороне службы доставки
          type: string
        directions:
          items:
            $ref: '#/components/schemas/DirectionV2'
          title: Список направлений доставки в тарифном плане
          type: array
        name:
          description: Человекопонятное название тарифного плана
          example: Быстрый от 2020-02-10
          title: Название тарифного плана
          type: string
        tariffType:
          description: 'Тип разделения тарифа по габаритам товаров.

            - MGT - малогабаритные товары

            - KGT - крупногабаритные товары

            Если поле не указано, то тариф должен содержать оба типа разделения (для обратной совместимости со старыми тарифами).

            '
          enum:
          - MGT
          - KGT
          title: Тип тарифа
          type: string
        tariffZones:
          items:
            $ref: '#/components/schemas/TariffZone'
          title: Список тарифных зон
          type: array
        termsZones:
          items:
            $ref: '#/components/schemas/TermsZone'
          title: Список зон сроков
          type: array
      required:
      - name
      - deliveryProviderTariffId
      - directions
      - tariffZones
      - termsZones
      type: object
    Delivery-directionTag:
      description: "Тэг направления, к которому привязывается пункт_самовывоза / индекс (область доставки).\n<br />\nИспользуется для связки в направлениях тарифа. Поля:\n  - `directionTagFrom`\n  - `directionTagTo`\n"
      example: moscow-2020-12-12
      title: Тэг направления
      type: string
    DeliveryError:
      nullable: true
      properties:
        code:
          description: код ошибки
          example: fail
          title: код ошибки
          type: string
        message:
          description: Человекопонятное описание ошибки
          example: something went wrong
          title: описание ошибки
          type: string
      required:
      - code
      - message
      type: object
  parameters:
    authHeader:
      description: Токен для авторизации
      example: Bearer ACCESS_TOKEN
      in: header
      name: Authorization
      required: true
  responses:
    DeliveryUnauthorized:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/DeliveryError4XX'
            type: object
      description: Ошибка аутентификации. Например, некорректный токен.
    DeliveryForbidden:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/DeliveryError4XX'
            type: object
      description: Ошибка авторизации. Например, нет прав для выполнения операции.
    DeliveryInternalServerError:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/DeliveryError'
            type: object
      description: internal server error
  securitySchemes:
    AuthorizationCode:
      description: Это API использует OAuth 2 с механизмом authorization_code. Используйте его для доступа к данным других пользователей при разработке стороннего приложения. [Подробнее](/api-catalog/auth/documentation#tag/ApplicationAccess)
      flows:
        authorizationCode:
          authorizationUrl: https://avito.ru/oauth
          scopes:
            ah:access: Взаимодействие с иерархией аккаунтов
          tokenUrl: https://api.avito.ru/token
      type: oauth2
    ClientCredentials:
      description: Это API использует OAuth 2 с механизмом client_credentials. Используйте его для доступа к возможностям своей личной учетной записи. [Подробнее](#tag/Access)
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://api.avito.ru/token
      type: oauth2
