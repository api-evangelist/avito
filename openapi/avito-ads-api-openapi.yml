components:
  schemas:
    CampaignType:
      description: Тип кампании
      enum:
      - textImage
      - HTML
      - video
      type: string
    V1GetCampaignStatisticIn:
      description: Request body для запроса статистики по кампании. Максимальный период между dateFrom и dateTo — 100 дней.
      properties:
        dateFrom:
          description: Дата начала периода в формате YYYY-MM-DD
          format: date
          type: string
        dateTo:
          description: Дата окончания периода в формате YYYY-MM-DD
          format: date
          type: string
      required:
      - dateFrom
      - dateTo
      type: object
    GroupsFilter:
      properties:
        advertisers:
          description: Список ID рекламодателей
          items:
            type: integer
          nullable: true
          type: array
        campaignIDs:
          description: Список ID кампаний
          items:
            type: integer
          nullable: true
          type: array
        ids:
          description: Список ID групп
          items:
            type: integer
          nullable: true
          type: array
        managers:
          description: Список ID менеджеров
          items:
            type: integer
          nullable: true
          type: array
        paces:
          description: Скорости показов
          items:
            $ref: '#/components/schemas/Paces'
          nullable: true
          type: array
        paymentModels:
          description: Список моделей оплаты
          items:
            $ref: '#/components/schemas/CampaignPaymentModel'
          nullable: true
          type: array
        statuses:
          description: Список статусов групп
          items:
            $ref: '#/components/schemas/GroupsStatus'
          nullable: true
          type: array
        timeFrame:
          $ref: '#/components/schemas/DateRange'
      type: object
    Group:
      properties:
        accountID:
          description: ID аккаунта
          type: integer
        actions:
          description: Доступные действия с группой
          items:
            type: string
          type: array
        activitySchedule:
          description: Расписание активности по дням
          properties:
            friday:
              $ref: '#/components/schemas/ActivityScheduleHours'
            monday:
              $ref: '#/components/schemas/ActivityScheduleHours'
            saturday:
              $ref: '#/components/schemas/ActivityScheduleHours'
            sunday:
              $ref: '#/components/schemas/ActivityScheduleHours'
            thursday:
              $ref: '#/components/schemas/ActivityScheduleHours'
            tuesday:
              $ref: '#/components/schemas/ActivityScheduleHours'
            wednesday:
              $ref: '#/components/schemas/ActivityScheduleHours'
          type: object
        advertiserID:
          description: ID рекламодателя
          type: integer
        audienceType:
          $ref: '#/components/schemas/AudienceType'
        budget:
          description: Бюджет группы в рублях с НДС
          type: integer
        budgetFrequency:
          $ref: '#/components/schemas/BudgetFrequency'
        budgetKopeks:
          description: Бюджет группы в копейках с НДС
          type: integer
        campaignID:
          description: ID кампании
          type: integer
        campaignType:
          $ref: '#/components/schemas/CampaignType'
        createdAt:
          description: Дата создания группы
          format: date-time
          type: string
        format:
          $ref: '#/components/schemas/GroupFormat'
        frequencyCount:
          description: Частота показов в рамках периода
          type: integer
        frequencyPeriod:
          $ref: '#/components/schemas/FrequencyPeriod'
        frequencyRules:
          description: Правила частотного ограничения
          items:
            $ref: '#/components/schemas/FrequencyRule'
          type: array
        haveCreative:
          description: Есть ли в группе креатив
          nullable: true
          type: boolean
        id:
          description: ID группы
          type: integer
        managerID:
          description: ID менеджера, ответственного за кампанию (userID)
          type: integer
        name:
          description: Название группы
          type: string
        pace:
          $ref: '#/components/schemas/Paces'
        paymentModel:
          $ref: '#/components/schemas/CampaignPaymentModel'
        periodEndAt:
          description: Конец периода кампании
          format: date-time
          nullable: true
          type: string
        periodStartAt:
          description: Начало периода кампании
          format: date-time
          nullable: true
          type: string
        periodTimezone:
          description: Таймзона периода показов
          type: string
        price:
          description: Цена в рублях с НДС
          type: integer
        priceControl:
          $ref: '#/components/schemas/GroupPriceControl'
        priceKopeks:
          description: Цена в копейках с НДС
          type: integer
        scheduleType:
          $ref: '#/components/schemas/ScheduleType'
        startASAP:
          description: Запускать как можно скорее
          type: boolean
        status:
          $ref: '#/components/schemas/GroupsStatus'
        targetingAgeIDs:
          description: ID возрастных сегментов
          items:
            type: integer
          type: array
        targetingAudienceIDs:
          description: ID аудиторий
          items:
            type: string
          type: array
        targetingFamilyStatusIDs:
          description: ID семейного статуса
          items:
            type: integer
          type: array
        targetingGenderIDs:
          description: ID пола
          items:
            type: integer
          type: array
        targetingIncomeIDs:
          description: ID доходных сегментов
          items:
            type: integer
          type: array
        targetingInterestIDs:
          description: ID интересов
          items:
            type: string
          type: array
        targetingLocationIDs:
          description: ID локаций
          items:
            type: integer
          type: array
        targetingParentStatusIDs:
          description: ID родительского статуса
          items:
            type: integer
          type: array
        updatedAt:
          description: Дата обновления группы
          format: date-time
          type: string
        userID:
          description: ID пользователя, создавшего группу
          type: integer
      required:
      - startASAP
      - frequencyCount
      - frequencyRules
      type: object
    V1GetAdvertisersListIn:
      description: Payload запроса на получение списка рекламодателей
      properties:
        filter:
          $ref: '#/components/schemas/AdvertiserFilter'
        limit:
          default: 20
          description: Количество записей на странице
          maximum: 100
          minimum: 1
          type: integer
        page:
          default: 1
          description: Номер страницы
          minimum: 1
          type: integer
      required:
      - filter
      - limit
      - page
      type: object
    CampaignStatus:
      description: Статус кампании
      enum:
      - draft
      - in_moderation
      - moderation_failed
      - partial_moderation
      - active
      - will_launch_soon
      - partially_active
      - will_stop_soon
      - pausing
      - paused
      - unpausing
      - stopped
      - finished
      - archived
      type: string
    ContractsFilter:
      properties:
        clients:
          $ref: '#/components/schemas/AdvertiserFilter'
        contractors:
          $ref: '#/components/schemas/AdvertiserFilter'
        ids:
          description: Список ID договоров
          items:
            type: integer
          nullable: true
          type: array
        numbers:
          description: Список номеров договоров
          items:
            type: string
          nullable: true
          type: array
      type: object
    CreativesStatus:
      description: Статус креатива
      enum:
      - draft
      - ready_for_moderation
      - in_moderation
      - moderation_failed
      - erir_registration
      - active
      - pausing
      - paused
      - unpausing
      - stopped
      - finished
      - archived
      type: string
    V1GetCampaignStatisticOut:
      description: Статистика по кампании
      properties:
        campaign:
          $ref: '#/components/schemas/CampaignStatistic'
        creatives:
          description: Статистика по креативам кампании
          items:
            $ref: '#/components/schemas/CreativeStatistic'
          type: array
        groups:
          description: Статистика по группам кампании
          items:
            $ref: '#/components/schemas/GroupStatistic'
          type: array
      required:
      - campaign
      - groups
      - creatives
      type: object
    V1GetUsersListByAccountOut:
      properties:
        total:
          type: integer
        users:
          items:
            $ref: '#/components/schemas/User'
          type: array
      required:
      - total
      - users
      type: object
    FrequencyRule:
      description: Правило частотного ограничения
      properties:
        count:
          description: Количество показов за указанный период
          minimum: 0
          type: integer
        period:
          $ref: '#/components/schemas/FrequencyPeriod'
      required:
      - count
      - period
      type: object
    V1GetAdvertisersListOut:
      properties:
        advertisers:
          items:
            $ref: '#/components/schemas/Advertiser'
          type: array
        total:
          type: integer
      required:
      - total
      - advertisers
      type: object
    V1GetContractsListOut:
      properties:
        contracts:
          items:
            $ref: '#/components/schemas/Contract'
          type: array
        total:
          type: integer
      required:
      - total
      - contracts
      type: object
    ShortAccountWithContract:
      properties:
        account:
          $ref: '#/components/schemas/ShortAccount'
        contract:
          $ref: '#/components/schemas/ContractForChildAccount'
      required:
      - account
      type: object
    V1CreateAdvertiserIn:
      description: Payload создания рекламодателя
      properties:
        actualAddress:
          description: 'Фактический адрес. Если не передан, используется legalAddress. Пример корректного адреса: 127015, г. Москва, ул. Лесная, д. 7'
          nullable: true
          type: string
        inn:
          description: ИНН организации
          type: string
        kpp:
          description: КПП организации
          nullable: true
          type: string
        legalAddress:
          description: 'Юридический адрес или адрес регистрации. Пример корректного адреса: 127015, г. Москва, ул. Лесная, д. 7'
          type: string
        legalRole:
          $ref: '#/components/schemas/LegalRole'
        legalType:
          $ref: '#/components/schemas/LegalType'
        longName:
          description: Полное наименование организации или ИП
          type: string
        ogrn:
          description: ОГРН или ОГРНИП
          type: string
        shortName:
          description: Краткое наименование организации или ИП
          type: string
      required:
      - inn
      - shortName
      - longName
      - ogrn
      - legalAddress
      - legalRole
      - legalType
      type: object
    V1CreateAccountOut:
      properties:
        accountID:
          type: integer
        warnings:
          description: Предупреждения о частично невыполненных sandbox-операциях. Если массив пустой, аккаунт подготовлен полностью.
          items:
            type: string
          type: array
      required:
      - accountID
      - warnings
      type: object
    User:
      properties:
        hasLoggedIn:
          description: Флаг, показывающий, заходил ли пользователь в аккаунт
          type: boolean
        id:
          description: ID пользователя
          type: integer
        role:
          $ref: '#/components/schemas/UserRole'
      required:
      - id
      - role
      - hasLoggedIn
      type: object
    Error:
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - message
      - code
      type: object
    V1CreateContractOut:
      properties:
        id:
          type: integer
      required:
      - id
      type: object
    ContractType:
      description: Тип контракта
      enum:
      - service
      - intermediary
      - external
      type: string
    BudgetFrequency:
      description: Частота расходования бюджета
      enum:
      - weekly
      - entirePeriod
      type: string
    V1GetChildAccountsWithBalancesListOut:
      properties:
        children:
          items:
            $ref: '#/components/schemas/ShortAccountWithBalance'
          type: array
      required:
      - children
      type: object
    GroupFormat:
      description: Формат группы объявлений
      enum:
      - mediaRoot
      - mediaSellerProfile
      - mediaPremium
      - media
      - native
      - htmlPremium
      - html
      - video
      type: string
    V1CreateNonPayerAccountIn:
      description: Payload создания аккаунта
      properties:
        isSelfAdvertisingEnabled:
          description: Флаг разрешающий рекламировать родительский аккаунт. Если вам надо рекламировать нового рекламодателя без возможности рекламировать родителя, выставлять - false
          nullable: true
          type: boolean
        shortName:
          description: Краткое название дочернего аккаунта, меньше 64 символов
          type: string
      required:
      - shortName
      - isSelfAdvertisingEnabled
      type: object
    LegalType:
      description: Тип ЮЛ
      enum:
      - ul
      - ip
      type: string
    V1GetCreativesStatisticOut:
      description: Статистика по креативам кампании
      properties:
        creatives:
          description: Статистика по креативам кампании
          items:
            $ref: '#/components/schemas/CreativeStatistic'
          type: array
      required:
      - creatives
      type: object
    ContractCounterpartyType:
      enum:
      - direct_with_advertiser
      - advertiser_intermediary
      type: string
    CampaignStatistic:
      description: Статистика кампании
      properties:
        campaignType:
          $ref: '#/components/schemas/CampaignType'
        data:
          description: Статистика в разбивке по дням
          items:
            $ref: '#/components/schemas/StatsData'
          type: array
        id:
          description: ID кампании
          type: integer
        name:
          description: Название кампании
          type: string
        paymentModel:
          $ref: '#/components/schemas/CampaignPaymentModel'
        totalData:
          $ref: '#/components/schemas/StatsData'
      required:
      - id
      - name
      - paymentModel
      - campaignType
      - data
      - totalData
      type: object
    CampaignsFilter:
      properties:
        additionalAgreementIDs:
          description: Список ID дополнительных соглашений
          items:
            type: integer
          nullable: true
          type: array
        advertisers:
          description: Список ID рекламодателей
          items:
            type: integer
          nullable: true
          type: array
        campaignTypes:
          description: Список типов кампаний
          items:
            $ref: '#/components/schemas/CampaignType'
          nullable: true
          type: array
        contractIDs:
          description: Список ID договоров
          items:
            type: integer
          nullable: true
          type: array
        createdAt:
          $ref: '#/components/schemas/DateRange'
        ids:
          description: Список ID кампаний
          items:
            type: integer
          nullable: true
          type: array
        managers:
          description: Список ID менеджеров
          items:
            type: integer
          nullable: true
          type: array
        paymentModels:
          description: Список моделей оплаты
          items:
            $ref: '#/components/schemas/CampaignPaymentModel'
          nullable: true
          type: array
        statuses:
