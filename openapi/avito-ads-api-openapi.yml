openapi: 3.0.0
info:
  contact:
    email: supportautoload@avito.ru
  description: 'API для взаимодействия с иерархией аккаунтов в Авито

    **Авито API для бизнеса предоставляется согласно [Условиям использования](https://www.avito.ru/legal/pro_tools/public-api).**

    '
  title: Иерархия Аккаунтов Access Ads API
  version: '1'
servers:
- url: https://api.avito.ru/
tags:
- name: Ads
paths:
  /ads/v1/account/{accountID}:
    parameters:
    - in: path
      name: accountID
      required: true
      schema:
        type: integer
    get:
      description: 'Возвращает реквизиты рекламного аккаунта по его ID: ИНН, КПП, ОГРН, юридический и фактический адреса, контактное лицо и менеджера.

        Токен имеет доступ только к тому аккаунту, в котором был выдан.

        '
      operationId: V1GetAccountByID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1GetAccountByIdOut'
          description: Ok
          headers:
            Api-Point-Balance:
              description: Остаток API-баллов после выполнения запроса
              schema:
                type: integer
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Некорректный запрос
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Не авторизован
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Доступ запрещен
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Аккаунт не найден
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Слишком много запросов
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка сервера
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Сервис недоступен
      security:
      - ClientCredentials: []
      summary: Получить аккаунт по ID
      x-cost:
        default: 1
        type: integer
      x-rate-limiter:
        default: 500
      tags:
      - Ads
    post:
      description: 'Создаёт тестовый аккаунт. Метод работает **только в песочнице** (`https://api.avito.ru/ads-sandbox/`); для боевых аккаунтов используйте веб-интерфейс кабинета.

        Ограничения песочницы: время жизни аккаунта — до 00:00 текущего дня; в сутки можно создать не более 1 тестового аккаунта.

        '
      operationId: V1CreateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1CreateAccountIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1CreateAccountOut'
          description: Ok
          headers:
            Api-Point-Balance:
              description: Остаток API-баллов после выполнения запроса
              schema:
                type: integer
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1CreateAccountOut'
          description: Аккаунт создан, но часть sandbox-данных не подготовилась
          headers:
            Api-Point-Balance:
              description: Остаток API-баллов после выполнения запроса
              schema:
                type: integer
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Некорректный запрос
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Не авторизован
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Доступ запрещен
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Слишком много запросов
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка сервера
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Сервис недоступен
      summary: Создать аккаунт в песочнице
      x-cost:
        default: 0
        type: integer
      x-rate-limiter:
        default: 500
      tags:
      - Ads
  /ads/v1/account/{accountID}/add-user:
    parameters:
    - in: path
      name: accountID
      required: true
      schema:
        type: integer
    post:
      description: 'Добавляет пользователя Авито в рекламный аккаунт с указанной ролью. Доступные роли: `admin` (полный доступ) и `viewer` (только просмотр).

        Пользователь идентифицируется по `userId` (ID профиля на Авито).

        '
      operationId: V1AddUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1AddUserIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
          description: Ok
          headers:
            Api-Point-Balance:
              description: Остаток API-баллов после выполнения запроса
              schema:
                type: integer
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Некорректный запрос
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Не авторизован
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Доступ запрещен
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Слишком много запросов
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка сервера
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Сервис недоступен
      security:
      - ClientCredentials: []
      summary: Добавить пользователя в аккаунт
      x-cost:
        default: 5
        type: integer
      x-rate-limiter:
        default: 500
      tags:
      - Ads
  /ads/v1/account/{accountID}/advertisers:
    parameters:
    - in: path
      name: accountID
      required: true
      schema:
        type: integer
    post:
      description: 'Возвращает список рекламодателей аккаунта с пагинацией. Доступные фильтры: список `ids`, список `inns`, список ролей (`roles`).

        Параметры пагинации: `limit` — от 1 до 100 (по умолчанию 20), `page` — от 1.

        '
      operationId: V1GetAdvertisersList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1GetAdvertisersListIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1GetAdvertisersListOut'
          description: Ok
          headers:
            Api-Point-Balance:
              description: Остаток API-баллов после выполнения запроса
