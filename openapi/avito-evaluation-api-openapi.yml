openapi: 3.2.0
info:
  contact:
    email: partner@autoteka.ru
  title: Автотека Evaluation API
  version: '1'
  x-codegen-version: v2
servers:
- url: https://pro.autoteka.ru/
tags:
- name: Evaluation
  x-displayName: Оценка и характеристики автомобиля
  x-subdivName: Оценка и характеристики автомобиля
paths:
  /autoteka/v1/catalogs/resolve:
    post:
      description: 'Метод для получения возможных параметров для заполнения пользователем.

        Первый запрос можно сделать без параметров, получить данные и далее, передавая нужные id и valueId в повторном запросе, получить все параметры.'
      operationId: catalogsResolve
      parameters:
      - $ref: '#/components/parameters/authHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCatalogsResolve'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogsResolveResponseBodyAutoteka'
          description: Успешный ответ
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validatingError'
          description: Ошибка валидации входных параметров
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbiddenError'
          description: Операцию невозможно выполнить
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFoundError'
          description: Информация не найдена
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalError'
          description: Информация об ошибке
      security:
      - ClientCredentials: []
      summary: Получение актуальных параметров Автокаталога
      tags:
      - Evaluation
  /autoteka/v1/specifications/by-plate-number:
    x-gateway:
      timeouts:
        connect: 200ms
        envoy: 5.0s
        read: 5s
        send: 5s
    post:
      description: 'Метод для запроса на получение спецификации по регистрационному номеру, возвращает идентификатор спецификации, по которому можно получить спецификацию в методе для получения спецификации.


        Чтобы подключить эту возможность, обратитесь к менеджеру Автотеки. Обратите внимание, что для её подключения надо завести отдельную учётную запись Автотеки.'
      operationId: specificationByPlateNumber
      parameters:
      - $ref: '#/components/parameters/authHeader'
      requestBody:
        content:
          application/json:
            example:
              plateNumber: X793YX77
            schema:
              $ref: '#/components/schemas/RequestReportByPlateNumberAutoteka'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSpecificationResponseBodyAutoteka'
          description: Успешный ответ
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validatingError'
          description: Ошибка валидации входных параметров
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbiddenError'
          description: Операцию невозможно выполнить
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFoundError'
          description: Информация не найдена
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequestsError'
          description: Превышено допустимое количество запросов
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalError'
          description: Информация об ошибке
      security:
      - ClientCredentials: []
      summary: Запрос характеристик по регистрационному номеру
      tags:
      - Evaluation
  /autoteka/v1/specifications/by-vehicle-id:
    x-gateway:
      timeouts:
        connect: 200ms
        envoy: 5.0s
        read: 5s
        send: 5s
    post:
      description: 'Метод для запроса на получение спецификации по идентификатору авто (vin/frame), возвращает идентификатор спецификации, по которому можно получить спецификацию в методе для получения спецификации.


        Чтобы подключить эту возможность, обратитесь к менеджеру Автотеки. Обратите внимание, что для её подключения надо завести отдельную учётную запись Автотеки.'
      operationId: specificationByVehicleId
      parameters:
      - $ref: '#/components/parameters/authHeader'
      requestBody:
        content:
          application/json:
            example:
              vehicleId: XTA210990Y2766111
            schema:
              $ref: '#/components/schemas/RequestReportByVehicleIdAutoteka'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSpecificationResponseBodyAutoteka'
          description: Успешный ответ
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validatingError'
          description: Ошибка валидации входных параметров
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbiddenError'
          description: Операцию невозможно выполнить
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFoundError'
          description: Информация не найдена
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalError'
          description: Информация об ошибке
      security:
      - ClientCredentials: []
      summary: Запрос характеристик по идентификатору авто (vin/frame)
      tags:
      - Evaluation
  /autoteka/v1/specifications/specification/{specificationID}:
    parameters:
    - $ref: '#/components/parameters/authHeader'
    - description: Идентификатор спецификации
      in: path
      name: specificationID
      required: true
      schema:
        minimum: 1
        type: integer
    get:
      description: 'Метод для получения спецификации по ее идентификатору.


        Чтобы подключить эту возможность, обратитесь к менеджеру Автотеки. Обратите внимание, что для её подключения надо завести отдельную учётную запись Автотеки.'
      operationId: specificationGetById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSpecificationResponseBodyAutoteka'
          description: Успешный ответ
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validatingError'
          description: Ошибка валидации входных параметров
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbiddenError'
          description: Операцию невозможно выполнить
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFoundError'
          description: Информация не найдена
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalError'
          description: Информация об ошибке
      security:
      - ClientCredentials: []
      summary: Получение характеристик по ID запроса
      tags:
      - Evaluation
  /autoteka/v1/valuation/by-specification:
    x-gateway:
      timeouts:
        connect: 200ms
        envoy: 5.0s
        read: 5s
        send: 5s
    post:
      description: 'Метод для получения оценки по параметрам, полученным из методов получения спецификации по ее идентификатору и получения параметров автокаталога Авито


        Чтобы подключить эту возможность, обратитесь к менеджеру Автотеки. Обратите внимание, что для её подключения надо завести отдельную учётную запись Автотеки.'
      operationId: valuationBySpecification
      parameters:
      - $ref: '#/components/parameters/authHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestValuationBySpecificationResolve'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValuationBySpecificationResponseBodyAutoteka'
          description: Успешный ответ
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validatingError'
          description: Ошибка валидации входных параметров
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbiddenError'
          description: Операцию невозможно выполнить
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFoundError'
          description: Информация не найдена
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequestsError'
          description: Превышено допустимое количество запросов
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalError'
          description: Информация об ошибке
      security:
      - ClientCredentials: []
      summary: Получение оценки по параметрам
      tags:
      - Evaluation
components:
  schemas:
    CatalogsResolveResponseDataAutoteka:
      properties:
        fields:
          items:
            $ref: '#/components/schemas/CatalogsFieldAutoteka'
          type: array
      required:
      - fields
      type: object
    GetSpecificationResponseDataAutoteka:
      properties:
        documents:
          $ref: '#/components/schemas/DocumentsResultAutoteka'
        newCarValuations:
          description: 'Массив оценок новых авто с аналогичной спецификацией.


            Чтобы подключить эту возможность, обратитесь к менеджеру Автотеки.

            '
          items:
            $ref: '#/components/schemas/NewCarValuation'
          type:
          - array
          - 'null'
        specification:
          $ref: '#/components/schemas/SpecificationResultAutoteka'
        valuation:
          $ref: '#/components/schemas/AvitoPriceValuation'
      type: object
    DocumentsResultAutoteka:
      properties:
        pts:
          description: Информация о ПТС
          properties:
            date:
              description: Дата выдачи ПТС
              example: '2024-07-31'
              type:
              - string
              - 'null'
            number:
              description: Номер ПТС
              example: '1234567890'
              type:
              - string
              - 'null'
            organization:
              description: Организация, выдавшая ПТС
              example: Название организации
              type:
              - string
              - 'null'
          type:
          - object
          - 'null'
        sts:
          description: Информация об СТС
          properties:
            date:
              description: Дата выдачи СТС
              example: '2024-07-31'
              type:
              - string
              - 'null'
            number:
              description: Серия и номер СТС
              example: '1234567890'
              type:
              - string
              - 'null'
          type:
          - object
          - 'null'
      type:
      - object
      - 'null'
    RequestReportByVehicleIdAutoteka:
      properties:
        vehicleId:
          description: Идентификатор запрашиваемого авто (vin/frame).
          minLength: 1
          type: string
      required:
      - vehicleId
      type: object
    AvitoPriceValuation:
      description: Оценка подержаного автомобиля от Авито
      properties:
        avgMarketPrice:
          description: Оценка на основе объявлений
          example: 950000
          type:
          - integer
          - 'null'
        avgMileage:
          description: Средний пробег аналогов
          example: 50000
          type:
          - integer
          - 'null'
        avgPriceWithCondition:
          description: Оценка с учетом состояния автомобилей на основе реальных сделок
          example: 936000
          type: integer
        avgYear:
          description: Средний год выпуска аналогов
          example: 2012.9999
          format: float
          type:
          - number
          - 'null'
        imvUrl:
          deprecated: true
          description: Поле больше не заполняется. Ссылка на страницу Авито IMV вида https://www.avito.ru/au-imv-info/2963331288
          example: https://www.avito.ru/au-imv-info/2963331288
          type:
          - string
          - 'null'
        itemsCount:
          description: Количество машин, учтенных в оценке
          example: 121
          type:
          - integer
          - 'null'
        marketNormalPriceRange:
          description: Диапазон "рыночной" оценки данного автомобиля по закрытым сделкам
          properties:
            max:
              description: Максимальная граница "рыночной" оценки данного автомобиля по закрытым сделкам
              example: 5248900
              type: integer
            min:
              description: Минимальная граница "рыночной" оценки данного автомобиля по закрытым сделкам
              example: 3248900
              type: integer
          required:
          - min
          - max
          type:
          - object
          - 'null'
        maxPrice:
          description: Максимальная цена похожих авто на основе объявлений
          example: 1000000
          type:
          - integer
          - 'null'
        minPrice:
          description: Минимальная цена похожих авто на основе объявлений
          example: 800000
          type:
          - integer
          - 'null'
      required:
      - avgPriceWithCondition
      type:
      - object
      - 'null'
    internalError:
      properties:
        error:
          properties:
            code:
              description: Код ошибки
              example: 500
              format: int32
              type: integer
            message:
              description: Сообщение об ошибке
              example: Service is temporary unavailable
              type: string
          required:
          - code
          - message
          type: object
      type: object
    RequestValuationBySpecificationResolve:
      properties:
        location:
          properties:
            lat:
              example: 55.755863189697266
              format: float64
              type: number
            long:
              example: 37.617698669433594
              format: float64
              type: number
          required:
          - lat
          - long
          type:
          - object
          - 'null'
        mileage:
          description: Пробег в км
          example: 15000
          format: int32
          type:
          - integer
          - 'null'
        specification:
          properties:
            bodyType:
              description: Тип ТС
              properties:
                label:
                  description: Значение параметра
                  example: Кроссовер
                  type: string
                valueId:
                  description: Идентификатор значения параметра
                  example: 13815
                  format: int64
                  minimum: 1
                  type: integer
              required:
              - label
              - valueId
              type:
              - object
              - 'null'
            brand:
              description: Марка
              properties:
                label:
                  description: Значение параметра
                  example: BMW
                  type: string
                valueId:
                  description: Идентификатор значения параметра
                  example: 13815
                  format: int64
                  minimum: 1
                  type: integer
              required:
              - label
              - valueId
              type: object
            color:
              description: Цвет
              properties:
                label:
                  description: Значение параметра
                  example: Серебряный
                  type: string
                valueId:
                  description: Идентификатор значения параметра
                  example: 13815
                  format: int64
                  minimum: 1
                  type: integer
              required:
              - label
              - valueId
              type:
              - object
              - 'null'
            complectation:
              description: Комплектация
              properties:
                label:
                  description: Значение параметра
                  example: Престиж
                  type: string
                valueId:
                  description: Идентификатор значения параметра
                  example: 13815
                  format: int64
                  minimum: 1
                  type: integer
              required:
              - label
              - valueId
              type:
              - object
              - 'null'
            doorsCount:
              description: Количество дверей
              properties:
                label:
                  description: Значение параметра
                  example: 4
                  type: string
                valueId:
                  description: Идентификатор значения параметра
                  example: 13815
                  format: int64
                  minimum: 1
                  type: integer
              required:
              - label
              - valueId
              type:
              - object
              - 'null'
            generation:
              description: 'Поколение


                Для оценки нового авто, параметр является необязательным, в таком случае возможно заполнение `{"label": "", "valueId": 0}`

                '
              properties:
                label:
                  description: Значение параметра
                  example: 1 поколение
                  type: string
                valueId:
                  description: Идентификатор значения параметра
                  example: 13815
                  format: int64
                  minimum: 0
                  type: integer
              required:
              - label
              - valueId
              type: object
            model:
              description: Модель
              properties:
                label:
                  description: Значение параметра
                  example: X3
                  type: string
                valueId:
                  description: Идентификатор значения параметра
                  example: 13815
                  format: int64
                  minimum: 1
                  type: integer
              required:
              - label
              - valueId
              type: object
            modification:
              description: 'Модификация


                Для оценки нового авто, параметр является необязательным, в таком случае возможно заполнение `{"label": "", "valueId": 0}`

                '
              properties:
                label:
                  description: Значение параметра
                  example: Люкс
                  type: string
                valueId:
                  description: Идентификатор значения параметра
                  example: 13815
                  format: int64
                  minimum: 0
                  type: integer
              required:
              - label
              - valueId
              type: object
            ownersCount:
              description: 'Количество владельцев


                Для оценки нового авто, параметр является необязательным, в таком случае возможно заполнение `{"label": "", "valueId": 0}`

                '
              properties:
                label:
                  description: Значение параметра
                  example: 4+
                  type: string
                valueId:
                  description: Идентификатор значения параметра
                  example: 13815
                  format: int64
                  minimum: 0
                  type: integer
              required:
              - label
              - valueId
              type: object
            year:
              description: Год выпуска
              properties:
                label:
                  description: Значение параметра
                  example: 2013
                  type: string
                valueId:
                  description: Идентификатор значения параметра
                  example: 13815
                  format: int64
                  minimum: 1
                  type: integer
              required:
              - label
              - valueId
              type: object
          required:
          - brand
          - model
          - year
          - generation
          - modification
          - ownersCount
          type: object
        vehicleId:
          description: Идентификатор авто (vin/frame).
          example: XTA21110987654321
          type:
          - string
          - 'null'
      required:
      - specification
      type: object
    SpecificationIdResultAutoteka:
      properties:
        specificationId:
          description: Идентификатор спецификации, по которому ее можно получить
          example: 1
          format: int64
          minimum: 1
          type: integer
      required:
      - specificationId
      type: object
    tooManyRequestsError:
      properties:
        error:
          properties:
            code:
              description: Код ошибки
              example: 429
              format: int32
              type: integer
          required:
          - code
          type: object
      type: object
    CatalogsFieldAutoteka:
      description: Параметр из каталога Авито
      properties:
        dataType:
          description: Тип значения параметра
          example: integer
          type: string
        id:
          description: Идентификатор параметра
          example: 110000
          format: int64
          minimum: 1
          type: integer
        label:
          description: Название параметра
          example: Марка
          type: string
        values:
          items:
            properties:
              label:
                description: Значение параметра
                example: Accent
                type: string
              valueId:
                description: Идентификатор значения параметра
                example: 403154
                format: int64
                minimum: 1
                type: integer
            required:
            - label
            - valueId
            type: object
          type: array
      required:
      - id
      - label
      - dataType
      - values
      type: object
    forbiddenError:
      properties:
        error:
          properties:
            code:
              description: Код ошибки
              example: 403
              format: int32
              type: integer
            message:
              description: Сообщение об ошибке
              example: Forbidden
              type: string
          required:
          - code
          - message
          type: object
      type: object
    ValuationBySpecificationResultAutoteka:
      properties:
        brand:
          description: Марка
          example: BMW
          type: string
        mileage:
          description: Пробег запрашиваемого авто
          example: 30000
          format: int64
          type:
          - integer
          - 'null'
        model:
          description: Модель
          example: X5
          type: string
        newCarValuations:
          description: 'Массив оценок новых авто с аналогичной спецификацией.


            Чтобы подключить эту возможность, обратитесь к менеджеру Автотеки.

            '
          items:
            $ref: '#/components/schemas/NewCarValuation'
          type:
          - array
          - 'null'
        ownersCount:
          description: Количество владельцев
          example: 4+
          type: string
        status:
          description: Статус `success`, `notFound`
          example: success
          type: string
        valuation:
          $ref: '#/components/schemas/AvitoPriceValuation'
        vehicleId:
          description: Идентификатор запрашиваемого авто (vin/frame)
          example: XUU09876543215671
          minLength: 3
          type:
          - string
          - 'null'
        year:
          description: Год выпуска запрашиваемого авто
          example: 2005
          format: int64
          type: integer
      required:
      - valuation
      - brand
      - model
      - year
      - ownersCount
      - status
      - vehicleId
      type: object
    validatingError:
      properties:
        error:
          properties:
