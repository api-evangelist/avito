                    type: error
                    updated_at: '2026-05-20T10:15:25+03:00'
                  section:
                    slug: error_params
                    title: Ошибки описания
                  url: null
                meta:
                  page: 1
                  pages: 73
                  perPage: 20
                  total: 1450
              schema:
                properties:
                  items:
                    description: Список объявлений
                    items:
                      $ref: '#/components/schemas/UploadItemAutoloadV4'
                    type: array
                  meta:
                    $ref: '#/components/schemas/PaginationMetaV4'
